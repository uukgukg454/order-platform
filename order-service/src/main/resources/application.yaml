#  application:
#    name: order-service
#  jpa:
#    hibernate:
#      # Flyway owns the schema (db/migration); Hibernate only checks that
#      # the entity mappings agree with it at startup and fails fast on
#      # drift, instead of silently altering tables (update) or dropping
#      # them (create/create-drop).
#      ddl-auto: validate
spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://localhost:5432/orders
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        enable.idempotence: true

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
  autoconfigure:
    exclude:
      # Broken against Spring Boot 4.1.0: it references a RedisProperties
      # class at a package path that no longer exists in this Boot version
      # (org.springframework.boot.autoconfigure.data.redis.RedisProperties),
      # so context refresh fails with ClassNotFoundException the moment this
      # auto-configuration runs. Excluded explicitly here — not left to
      # @ConditionalOnMissingBean to skip after the fact — so it's
      # guaranteed to never even attempt to run. See RedissonConfig for the
      # manual RedissonClient bean that replaces it.
      - org.redisson.spring.starter.RedissonAutoConfigurationV2

app:
  cache:
    order-ttl-seconds: 300
    order-local-ttl-seconds: 30
    order-local-max-size: 1000
  kafka:
    topics:
      orders-created: orders.created

management:
  endpoints:
    web:
      exposure:
        # Verified against this exact Boot 4.1.0 jar's WebEndpointProperties
        # class (@ConfigurationProperties("management.endpoints.web"),
        # nested Exposure.include) rather than assumed from older Spring
        # Boot versions — this property path turned out unchanged despite
        # the internal package reshuffling elsewhere in this app (Kafka/
        # Flyway/Redis autoconfigure all moved packages in Boot 4). health
        # is exposed by default already; prometheus is not, so it's added
        # here explicitly.
        include: health, prometheus
  metrics:
    distribution:
      percentiles-histogram:
        # Enables Micrometer's _bucket series for this one metric, so
        # Prometheus's histogram_quantile() can compute real p95/p99
        # latency — the default _count/_sum/_max only support average and
        # max, not arbitrary percentiles. Bracket notation is required
        # here, not three levels of YAML nesting (http: server: requests:):
        # percentiles-histogram binds to a Map<String, Boolean> keyed by
        # the literal metric name "http.server.requests" (confirmed against
        # this Boot 4.1.0 jar's MetricsProperties.Distribution class) —
        # writing it as nested YAML would instead produce a Map with a
        # nested "http"/"server"/"requests" structure, which is not what
        # this property expects.
        "[http.server.requests]": true

server:
  port: 8080