# Activated via SPRING_PROFILES_ACTIVE=docker inside a container. Additive
# on top of application.yaml, not a replacement — Spring merges profile-
# specific files over the base one, so only the connection hostnames that
# actually differ between host-based bootRun and a container on the Compose
# network need to be listed here.
spring:
  datasource:
    # Same database name/credentials as application.yaml — only the host
    # changes, from localhost to the Compose service name. Port stays 5432
    # here too: order-postgres is the one Postgres container application.yaml
    # doesn't remap to a different host port, unlike inventory-service's/
    # payment-service's own application-docker.yml (see those for a case
    # where the port genuinely differs from the base profile).
    url: jdbc:postgresql://order-postgres:5432/orders
  data:
    redis:
      host: order-redis
  kafka:
    # order-kafka:29092, not :9092 — a Kafka Compose setup conventionally
    # advertises two listeners: one (9092) for host-side clients connecting
    # from outside Docker, and a separate one (29092) for other containers
    # on the same Docker network. application.yaml's localhost:9092 only
    # resolves from the host itself; a container needs the internal listener
    # instead.
    bootstrap-servers: order-kafka:29092
