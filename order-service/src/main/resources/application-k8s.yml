# Activated via SPRING_PROFILES_ACTIVE=k8s when running inside the minikube
# cluster. Additive on top of application.yaml, same overlay pattern as
# application-docker.yml.
spring:
  datasource:
    # order-postgres resolves via Kubernetes' own internal DNS to the
    # Service of the same name in this namespace — the K8s Service was
    # deliberately named to match the Compose container name it replaces.
    url: jdbc:postgresql://order-postgres:5432/orders
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: order-redis
  kafka:
    # order-kafka:9092 — the Bitnami kafka chart's client listener port
    # (see helm/order-kafka/values.yaml), not the dual PLAINTEXT/
    # PLAINTEXT_HOST split the old hand-rolled k8s/order-kafka-deployment.yaml
    # used on 29092/9092. The chart exposes one client listener, forced to
    # PLAINTEXT, on 9092 for every client regardless of where it connects
    # from — matching inventory-service/payment-service/search-indexer-service's
    # own application-k8s.yml.
    bootstrap-servers: order-kafka:9092