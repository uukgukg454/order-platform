# Activated via SPRING_PROFILES_ACTIVE=k8s. Additive on top of application.yaml,
# same overlay pattern as application-docker.yml and order-service's own
# application-k8s.yml. Hostnames match the K8s Service names deliberately
# chosen to mirror the Compose container names.
spring:
  datasource:
    url: jdbc:postgresql://inventory-postgres:5432/inventory
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: order-redis
  kafka:
    bootstrap-servers: order-kafka:29092
