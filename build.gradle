// Root build.gradle for the order-platform multi-module build. Deliberately
// minimal: only configuration meant to apply across every subproject lives
// here (shared repositories, the shared Java toolchain version). Each
// subproject's own dependencies, plugins, and build-specific config
// (Spring Boot, Postgres, Redis, Redisson, ...) stay in that subproject's
// own build.gradle — see order-service/build.gradle — rather than being
// centralized here, so this file doesn't need to change every time a
// subproject's dependency set does.

allprojects {
    repositories {
        mavenCentral()
    }
}

// plugins.withId(...) rather than forcing 'java' onto every subproject:
// this only configures the toolchain for subprojects that already apply
// the java plugin themselves (order-service does), so a future non-Java
// subproject wouldn't be affected by this block at all.
subprojects {
    plugins.withId('java') {
        java {
            toolchain {
                languageVersion = JavaLanguageVersion.of(21)
            }
        }
    }
}
