#      # Flyway owns the schema (db/migration); Hibernate only checks that
#      # the entity mappings agree with it at startup and fails fast on
#      # drift, instead of silently altering tables (update) or dropping
#      # them (create/create-drop).
#      ddl-auto: validate
spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://localhost:5432/orders
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080