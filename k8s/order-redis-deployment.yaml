# SUPERSEDED (Phase 8 Helm conversion) — this hand-rolled Deployment/Service
# is no longer applied to the cluster. order-redis now runs via the Bitnami
# redis chart (see helm/order-redis/values.yaml) plus
# k8s/order-redis-alias-service.yaml. Kept here for reference only. Do NOT
# kubectl apply this file — it will conflict with the Helm-managed Service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-redis
  namespace: order-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-redis
  template:
    metadata:
      labels:
        app: order-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: order-redis
  namespace: order-platform
spec:
  selector:
    app: order-redis
  ports:
    - port: 6379
      targetPort: 6379
