# SUPERSEDED (Phase 8 Helm conversion) — this hand-rolled Deployment/Service
# is no longer applied to the cluster. inventory-service now runs via the
# order-platform Helm chart (see helm/order-platform/). Kept here for
# reference only. Do NOT kubectl apply this file — it will conflict with
# the Helm-managed Service of the same name.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  namespace: order-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
    spec:
      initContainers:
        - name: wait-for-deps
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z inventory-postgres 5432; do echo waiting for inventory-postgres; sleep 2; done
              until nc -z order-redis 6379; do echo waiting for order-redis; sleep 2; done
              until nc -z order-kafka 9092; do echo waiting for order-kafka; sleep 2; done
      containers:
        - name: inventory-service
          image: order-service-inventory-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: inventory-service-config
            - secretRef:
                name: inventory-service-db-credentials
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-service
  namespace: order-platform
spec:
  selector:
    app: inventory-service
  ports:
    - port: 8081
      targetPort: 8081
