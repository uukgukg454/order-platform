# SUPERSEDED (Phase 8 Helm conversion, follow-up) — replaced by the Bitnami
# postgresql chart, see helm/inventory-postgres/values.yaml. This
# Deployment/Service pair is no longer applied to the cluster; kept here
# for reference only. The live inventory-postgres StatefulSet/Service are
# managed by Helm (helm install inventory-postgres bitnami/postgresql
# -n order-platform -f helm/inventory-postgres/values.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-postgres
  namespace: order-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-postgres
  template:
    metadata:
      labels:
        app: inventory-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: inventory
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: postgres
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-postgres
  namespace: order-platform
spec:
  selector:
    app: inventory-postgres
  ports:
    - port: 5432
      targetPort: 5432
