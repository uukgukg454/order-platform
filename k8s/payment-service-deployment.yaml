apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: order-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      initContainers:
        - name: wait-for-deps
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z payment-postgres 5432; do echo waiting for payment-postgres; sleep 2; done
              until nc -z order-redis 6379; do echo waiting for order-redis; sleep 2; done
              until nc -z order-kafka 29092; do echo waiting for order-kafka; sleep 2; done
      containers:
        - name: payment-service
          image: order-service-payment-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
          envFrom:
            - configMapRef:
                name: payment-service-config
            - secretRef:
                name: payment-service-db-credentials
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: order-platform
spec:
  selector:
    app: payment-service
  ports:
    - port: 8082
      targetPort: 8082
