apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: order-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      initContainers:
        - name: wait-for-deps
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z order-postgres 5432; do echo waiting for order-postgres; sleep 2; done
              until nc -z order-redis 6379; do echo waiting for order-redis; sleep 2; done
      containers:
        - name: order-service
          image: order-service-order-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: order-service-config
            - secretRef:
                name: order-service-db-credentials
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: order-platform
spec:
  selector:
    app: order-service
  ports:
    - port: 8080
      targetPort: 8080
