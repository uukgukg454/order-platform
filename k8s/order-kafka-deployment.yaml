# SUPERSEDED (Phase 8 Helm conversion) — this hand-rolled Deployment/Service
# is no longer applied to the cluster. order-kafka now runs via the Bitnami
# kafka chart (see helm/order-kafka/values.yaml). Note the port also changed
# in the switch: this file's dual PLAINTEXT/PLAINTEXT_HOST listeners on
# 29092/9092 don't carry over — the chart exposes a single client listener,
# forced to PLAINTEXT, on 9092 for every client (see every service's own
# application-k8s.yml, all pointing at order-kafka:9092 now, not :29092).
# Kept here for reference only. Do NOT kubectl apply this file — it will
# conflict with the Helm-managed Service of the same name.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-kafka
  namespace: order-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-kafka
  template:
    metadata:
      labels:
        app: order-kafka
    spec:
      containers:
        - name: kafka
          image: apache/kafka:latest
          ports:
            - containerPort: 29092
            - containerPort: 9092
            - containerPort: 9093
          env:
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            - name: KAFKA_NUM_PARTITIONS
              value: "3"
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@localhost:9093"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://:29092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://order-kafka:29092,PLAINTEXT_HOST://localhost:9092"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
---
apiVersion: v1
kind: Service
metadata:
  name: order-kafka
  namespace: order-platform
spec:
  selector:
    app: order-kafka
  ports:
    - name: plaintext
      port: 29092
      targetPort: 29092
    - name: plaintext-host
      port: 9092
      targetPort: 9092
    - name: controller
      port: 9093
      targetPort: 9093
